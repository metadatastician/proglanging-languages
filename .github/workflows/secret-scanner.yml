#
# Estate shared secret scanner (gitleaks + rust-secrets + shell-secrets).
# Caller shape copied from hyperpolymath/.github @ .github/workflows/secret-scanner.yml,
# with the reusable pinned to a full commit SHA rather than @main.
#
# `secrets: inherit` is REQUIRED — without it the gitleaks action's inner
# secrets.GITHUB_TOKEN is empty and the scan silently degrades to no-op.
name: Secret Scanner

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  scan:
    uses: hyperpolymath/standards/.github/workflows/secret-scanner-reusable.yml@bd0df9ead7faf0cdfe0e13e7966d91e28d0101d4
    secrets: inherit
