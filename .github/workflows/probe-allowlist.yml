name: PROBE-allowlist
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  plain:
    name: probe · no actions used
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "plain step ran"
  uses_pinned_action:
    name: probe · actions/checkout by SHA
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: echo "checkout ran"
